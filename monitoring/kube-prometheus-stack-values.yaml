# Trimmed-down kube-prometheus-stack for a laptop-sized kind cluster.
fullnameOverride: kps

alertmanager: { enabled: false }
nodeExporter: { enabled: false }          # needs host mounts that kind-in-Docker-Desktop does not provide cleanly
# kind's control-plane components bind to localhost, so these scrapes would only show as "down".
kubeEtcd: { enabled: false }
kubeScheduler: { enabled: false }
kubeControllerManager: { enabled: false }
kubeProxy: { enabled: false }

prometheus:
  service: { type: NodePort, nodePort: 30900 }
  prometheusSpec:
    scrapeInterval: 15s
    retention: 6h
    # Pick up ServiceMonitors from any release/namespace (our chart's ServiceMonitors live in "demo").
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1Gi }

grafana:
  service: { type: NodePort, nodePort: 30300 }
  # Read-only anonymous access so the demo video needs no login; the NodePort is published on 127.0.0.1 only.
  # The admin password is generated by scripts/03-monitoring.ps1 (not stored in git).
  grafana.ini:
    auth.anonymous: { enabled: true, org_role: Viewer }
    users: { default_theme: dark }
  sidecar:
    dashboards: { enabled: true, label: grafana_dashboard, labelValue: "1" }
  defaultDashboardsEnabled: false         # keep the dashboard list to just ours
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }

