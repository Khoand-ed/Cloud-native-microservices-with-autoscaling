{{- $name := printf "%s-catalogue" .Release.Name -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: catalogue
    {{- include "app.labels" . | nindent 4 }}
spec:
  {{- if not .Values.catalogue.hpa.enabled }}
  replicas: {{ .Values.catalogue.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: catalogue
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalogue
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: catalogue
          image: "{{ .Values.catalogue.image.repository }}:{{ .Values.catalogue.image.tag }}"
          imagePullPolicy: {{ .Values.catalogue.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - { name: DB_HOST, value: {{ .Release.Name }}-postgres }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-postgres-credentials, key: database } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-postgres-credentials, key: user } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-postgres-credentials, key: password } }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{- toYaml .Values.catalogue.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: catalogue
    {{- include "app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.catalogue.service.type }}
  selector:
    app.kubernetes.io/name: catalogue
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: http, port: {{ .Values.catalogue.service.port }}, targetPort: http }
{{- if .Values.catalogue.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: catalogue
    {{- include "app.labels" . | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $name }} }
  minReplicas: {{ .Values.catalogue.hpa.minReplicas }}
  maxReplicas: {{ .Values.catalogue.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.catalogue.hpa.targetCPUUtilizationPercentage }} }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ .Values.catalogue.hpa.scaleUpStabilizationSeconds }}
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.catalogue.hpa.scaleDownStabilizationSeconds }}
{{- end }}
